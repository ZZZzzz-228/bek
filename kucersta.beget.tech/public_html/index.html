    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1829 0%, #0f2240 50%, #162d52 100%);
        }

        .card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            box-shadow:
                0 20px 60px rgba(74, 144, 226, 0.18),
                0 4px 20px rgba(74, 144, 226, 0.10);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-wrap {
            width: 140px;
            height: 140px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        .logo-wrap svg {
            width: 100%;
            height: 100%;
            fill: #1565C0;
            filter: drop-shadow(0 8px 18px rgba(74, 144, 226, 0.35));
        }

        .btn-admin {
            background: linear-gradient(135deg, #4A90E2 0%, #1565C0 100%);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 36px;
            box-shadow:
                0 8px 24px rgba(74, 144, 226, 0.40),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-admin::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.20), transparent);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 32px rgba(74, 144, 226, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.30);
        }

        .btn-admin:hover::before { opacity: 1; }

        .btn-admin:active {
            transform: translateY(0);
            box-shadow:
                0 4px 14px rgba(74, 144, 226, 0.40),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .footer-text { font-size: 12px; color: #78909C; }
        .footer-text a { color: #1565C0; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }

        .card-subtitle { color: #546E7A; font-size: 15px; line-height: 1.55; }
    </style>
